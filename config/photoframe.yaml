substitutions:
  board: esp32-s3-devkitc-1
  framework: esp-idf
  ap_ssid: "Photoframe"
  home_assistant_api_encryption_key: !secret photoframe_home_assistant_api_encryption_key
  ota_password: !secret photoframe_ota_password

  # Kept in secrets.yaml: this repo is public and the URL carries an internal
  # hostname. It also makes swapping the name for the bare IP a non-commit.
  photo_url: !secret photoframe_photo_url

esphome:
  name: photoframe
  friendly_name: Photoframe
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_photo

# XIAO ESP32-S3 Plus carries 16MB flash. Merged into base.package.yaml's esp32 block.
esp32:
  flash_size: 16MB

# Not optional: the 800x480 6-color frame buffer plus the decoded image
# do not fit in internal RAM.
psram:
  mode: octal
  speed: 80MHz

packages:
  - !include packages/base.package.yaml
  - !include packages/photoframe/display.package.yaml
