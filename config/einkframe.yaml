substitutions:
  board: esp32-s3-devkitc-1
  framework: arduino
  home_assistant_api_encryption_key: !secret home_assistant_api_encryption_key
  ota_password: !secret ota_password

esphome:
  name: einkframe
  friendly_name: eInkFrame
  includes:
    - packages/einkframe/text_utils
    - packages/einkframe/einkframe_utils
    - packages/einkframe/renderer_utils
  # Run once at startup to make sure the display draws initial data
  # even if update_interval: never
  on_boot:
    priority: -10  # run late, after HA connection is established
    then:
      - logger.log: "Boot complete, waiting for HA..."
      - delay: 15s
      - script.execute: refresh_display_cycle
      - script.wait: refresh_display_cycle
      - script.execute: enter_sleep

packages:
  - !include packages/base.package.yaml
  - !include packages/einkframe/sensors.package.yaml
  - !include packages/einkframe/fonts.package.yaml

deep_sleep:
  id: deep_sleep_control

switch:
  - platform: gpio
    pin: GPIO6
    id: adc_enable
    restore_mode: ALWAYS_OFF   # Start LOW to save power
    name: "ADC Enable"

binary_sensor:
  - platform: homeassistant
    id: dev_mode
    entity_id: input_boolean.einkframe_dev_mode
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: dev_mode
            then:
              - deep_sleep.prevent: deep_sleep_control
              - logger.log: "Dev mode ON — deep sleep prevented"
            else:
              - deep_sleep.allow: deep_sleep_control
              - logger.log: "Dev mode OFF — deep sleep allowed"

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Stockholm"
    on_time:
      - seconds: 0
        minutes: /15
        then:
          - if:
              condition:
                binary_sensor.is_on: dev_mode
              then:
                - script.execute: refresh_display_cycle

script:
  ######## Read battery ########
  - id: read_battery_script
    mode: single
    then:
      - switch.turn_on: adc_enable
      - delay: 10ms
      - component.update: battery_adc
      - delay: 2s
      - wait_until:
          condition:
            lambda: |-
              return !isnan(id(battery_adc).state);
          timeout: 10s
      - switch.turn_off: adc_enable
      - component.update: battery_percent
      - wait_until:
          condition:
            lambda: |-
              return !isnan(id(battery_percent).state);
          timeout: 5s
  ######## Wait for all sensors to be ready ########
  - id: wait_for_all_sensors
    mode: single
    then:
      - logger.log: "Waiting for battery and Home Assistant sensors..."
      - wait_until:
          condition:
            lambda: |-
              return (
                !isnan(id(battery_adc).state) &&
                !isnan(id(battery_percent).state) &&
                !id(myWeather).state.empty() &&
                !id(myTemperature).state.empty() &&
                !id(current_date).state.empty() &&
                !id(myIcelandicWord).state.empty() &&
                !id(word_translations).state.empty() &&
                !id(word_example1_is).state.empty() &&
                !id(word_example1_se).state.empty() &&
                !id(word_example2_is).state.empty() &&
                !id(word_example2_se).state.empty() &&
                !id(expected_rain).state.empty() &&
                !id(uv_index).state.empty()
              );
          timeout: 60s
      - logger.log: "All sensors ready!"
  ######## Main display refresh cycle ########
  - id: refresh_display_cycle
    mode: single
    then:
      - logger.log: "Starting refresh cycle..."
      - script.execute: read_battery_script
      - script.wait: read_battery_script
      - script.execute: wait_for_all_sensors
      - script.wait: wait_for_all_sensors
      - logger.log: "Updating e-ink display..."
      - component.update: eink_display
      - logger.log: "Display refresh done!"
  ######## Enter deep sleep if dev mode is off ########
  - id: enter_sleep
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: dev_mode
          then:
            - logger.log: "Dev mode ON — staying awake"
          else:
            - lambda: |-
                auto now = id(homeassistant_time).now();
                int sleep_minutes = minutes_to_next_slot(now.hour, now.minute);
                int current_minutes = now.hour * 60 + now.minute;

                ESP_LOGI("sleep", "Sleeping for %d minutes (next wake at %02d:00)",
                         sleep_minutes, (current_minutes + sleep_minutes) / 60 % 24);

                id(deep_sleep_control).set_sleep_duration(sleep_minutes * 60 * 1000);
            - deep_sleep.enter: deep_sleep_control

# Display info via SPI
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    model: 7.50inv2
    id: eink_display
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin: 
      number: GPIO4
      inverted: true
    update_interval: never
    lambda: |-
      ESP_LOGD("epaper", "weather: %s", id(myWeather).state.c_str());
      ESP_LOGD("epaper", "temperature: %s", id(myTemperature).state.c_str());
      ESP_LOGD("epaper", "battery voltage: %.2f", id(battery_adc).state);
      ESP_LOGD("epaper", "expected rain: %s", id(expected_rain).state.c_str());
      ESP_LOGD("epaper", "uv index: %s", id(uv_index).state.c_str());

      draw_title(it, id(myFont), TitleState{
        id(current_date).state,
      });

      draw_info_column(it, id(subheaderFont), id(normalFont), id(font_mdi_medium), InfoColumnState{
        id(myWeather).state,
        id(myTemperature).state,
        id(expected_rain).state,
        id(uv_index).state,
        id(battery_percent).state,
      });

      std::vector<ExamplePair> examples;
      if (id(word_example1_is).state != "unknown") {
        examples.push_back({id(word_example1_is).state, id(word_example1_se).state});
      }
      if (id(word_example2_is).state != "unknown") {
        examples.push_back({id(word_example2_is).state, id(word_example2_se).state});
      }

      draw_word_of_day(it, id(subheaderFont), id(normalFont), id(smallerFont), WordOfDayState{
        id(myIcelandicWord).state,
        id(word_translations).state,
        examples,
      });