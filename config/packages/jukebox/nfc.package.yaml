# RC522 NFC reader via SPI
# Wiring: MOSI → GPIO23, MISO → GPIO19, SCK → GPIO18, SDA/CS → GPIO21, RST → GPIO0
spi:
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18

rc522_spi:
  cs_pin: GPIO21
  #reset_pin: GPIO0
  on_tag:
    then:
      - logger.log:
          format: "NFC tag scanned: %s"
          args: ['x.c_str()']
