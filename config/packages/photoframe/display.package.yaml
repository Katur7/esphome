# Seeed XIAO ePaper Display Board EE04 + XIAO ESP32-S3 Plus
# Panel: Waveshare 7.3" Spectra 6 (E6), 800x480, on the 50-pin FPC connector.
#
# Pinout is identical to the TRMNL board einkframe runs on — same Seeed driver
# board family. Battery ADC (GPIO1, gated by GPIO6) and buttons KEY0/KEY2
# (GPIO2, GPIO5) are unused for now; KEY1 (GPIO3) triggers refresh & redraw.
#
# Rationale for the non-obvious settings here lives in
# specs/photoframe/ARCHITECTURE.md § How It Fits Together.
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper
    # Panel-specific model, not the generic Spectra-E6: it carries the 800x480
    # dimensions and data_rate 20MHz.
    model: 7.3in-Spectra-E6
    # Portrait, 480x800. Puts the FPC ribbon on the RIGHT of the finished frame;
    # 270 is the mirror.
    rotation: 90°
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      # E6 busy is active-low. Wrong, and the driver never waits, "succeeds" in
      # ~1s, and draws nothing.
      inverted: true
      mode:
        input: true
        pullup: true
    # Driven manually from on_download_finished — a colour refresh takes ~30s
    # and is the most expensive thing this device does.
    update_interval: never
    # No inset: the bezel measures 0-1 px, so content runs to the very edge.
    lambda: |-
      it.fill(Color::WHITE);
      it.image(0, 0, id(photo));
