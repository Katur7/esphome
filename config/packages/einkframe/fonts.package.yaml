# Define font to show info
font:
  - file: "gfonts://Inter@700"
    id: myFont
    size: 32
    glyphsets: GF_Latin_Core
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@700"
    id: subheaderFont
    size: 24
    glyphsets: GF_Latin_Core
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@700"
    id: normalFont
    size: 20
    glyphsets: GF_Latin_Core
    ignore_missing_glyphs: true
  - file: "gfonts://Inter@700"
    id: smallerFont
    size: 16
    glyphsets: GF_Latin_Core
    ignore_missing_glyphs: true

  # Include Material Design Icons font
  # Thanks to https://community.home-assistant.io/t/display-materialdesign-icons-on-esphome-attached-to-screen/199790/16
  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_medium
    size: 36
    glyphs: [
      "\U000F058E", # mdi-water-percent
      "\U000F0D43", # mdi-air-filter
      "\U000F002A", # mdi-alert-outline
      "\U000F0594", # mdi-weather-night - clear-night
      "\U000F0590", # mdi-weather-cloudy
      "\U000F05D6", # mdi-alert-circle-outline - exeptionnal
      "\U000F0591", # mdi-weather-fog
      "\U000F0592", # mdi-weather-hail
      "\U000F0593", # mdi-weather-lightning
      "\U000F067E", # mdi-weather-lightning-rainy
      "\U000F0595", # mdi-weather-partly-cloudy
      "\U000F0596", # mdi-weather-pouring
      "\U000F0597", # mdi-weather-rainy
      "\U000F0598", # mdi-weather-snowy
      "\U000F067F", # mdi-weather-snowy-rainy
      "\U000F0599", # mdi-weather-sunny
      "\U000F059D", # mdi-weather-windy
      "\U000F059E", # mdi-weather-windy-variant

      "\U000F1A35", # mdi-cloud-percent
      "\U000F054A", # mdi-umbrella
      "\U000F17FF", # mdi-sun-wireless-outline
      "\U000F0079"  # mdi-battery
    ]
